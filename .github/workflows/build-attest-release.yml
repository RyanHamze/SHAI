name: Build, test, attest, and draft release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends apt-utils bash ca-certificates coreutils dpkg-dev findutils git gzip perl python3 shellcheck tar util-linux
      - name: Static analysis
        run: |
          shellcheck \
            installer/build.sh \
            installer/src/shai-installer \
            installer/src/shai-theme-apply \
            installer/src/shai-theme-default \
            installer/src/shai-theme-reset \
            release/*.sh \
            tests/*.sh \
            tools/*.sh \
            connectivity/bin/*
      - name: Build and test
        run: |
          chmod +x installer/build.sh installer/src/* release/*.sh tests/*.sh tools/*.sh connectivity/bin/*
          tests/test-package.sh
      - name: Attest DEB provenance
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/shai-installer_*_amd64.deb
      - name: Upload release bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: shai-release-bundle
          path: |
            dist/shai-installer_*_amd64.deb
            dist/SHA256SUMS
            dist/SHAI-APP-CATALOG.json
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shai-release-bundle
          path: release-bundle
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-bundle/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "SHAI $TAG" --notes "Draft only. Do not publish until offline APT and app-catalog signatures are attached and independently verified."
